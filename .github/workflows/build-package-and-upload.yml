name: Check and build addon

on:
  workflow_dispatch:
    inputs:
      forever_only:
        description: Only build the WoW Forever package
        required: true
        default: true
        type: boolean
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
        # Branch and pull-request builds validate packages but never publish
        # alpha files. Version tags are the only publishing trigger.
        CF_API_KEY: ${{ github.ref_type == 'tag' && secrets.CF_API_KEY || '' }}
        #WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        #WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        GITHUB_OAUTH: ${{ github.ref_type == 'tag' && secrets.GITHUB_TOKEN || '' }}
        RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Rename WhatsNew.md
        if: github.ref_type == 'branch'
        run: |
           mv -vf WhatsNew.md WhatsNew_.md
           echo "file moved"

      - name: Run luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -qo 011

      - name: Package retail
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipretail') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -n "{package-name}-{project-version}-retail{nolib}"

      - name: Package classic
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#retailOnly') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipclassic') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g classic

      - name: Package mists
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#retailOnly') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipmop') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g mists

      - name: Package bcc
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#retailOnly') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipbcc') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g bcc

      - name: Package wrath
        if: >-
          !(github.event_name == 'workflow_dispatch' && inputs.forever_only) &&
          !contains(github.ref_name, '-Forever-') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#retailOnly') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skiptitan') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g titan

      - name: Package Forever
        if: >-
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipforever') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: BigWigsMods/packager@v2.6.1
        with:
          args: -g forever -n "{package-name}-{project-version}-forever{nolib}"

      - name: Mark release candidates as prereleases
        if: github.ref_type == 'tag' && contains(github.ref_name, '-RC')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --prerelease

      - name: Verify all client packages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          interfaces = {
              "retail": "120100",
              "classic": "11509",
              "mists": "50504",
              "bcc": "20506",
              "titan": "38002",
              "forever": "16001",
          }
          for flavor, interface in interfaces.items():
              matches = [p for p in Path(".release").glob("*-" + flavor + ".zip") if "-nolib" not in p.name]
              assert len(matches) == 1, (flavor, matches)
              with ZipFile(matches[0]) as archive:
                  toc = archive.read("Decursive/Decursive.toc").decode("utf-8-sig")
                  assert "## Interface: " + interface in toc, (flavor, toc)
                  assert "Decursive/Libs/AceDB-3.0/AceDB-3.0.lua" in archive.namelist(), flavor
              print(flavor, matches[0].name, interface)
          PY

      - name: Upload all-client test packages
        if: >-
          always() &&
          (github.ref_type == 'branch' || github.event_name == 'pull_request') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipforever') &&
          !contains(env.RELEASE_COMMIT_MESSAGE, '#skipall')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Decursive-AllClients-${{ github.sha }}
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
